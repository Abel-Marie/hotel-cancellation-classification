[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-cancellation"
version = "1.0.0"
description = "Predict hotel booking cancellations at booking time: the full ML process, notebook and pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Exact versions: the notebook and the pipeline must reproduce the same numbers.
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy>=1.13",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "optuna==5.0.0",
    "shap==0.54.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "PyYAML==6.0.3",
    "joblib>=1.4",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "skl2onnx==1.20.0",
    "onnxmltools==1.16.0",
    "imbalanced-learn==0.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "pre-commit>=3.7",
    "jupytext==1.19.6",
    "nbconvert==7.17.2",
    "nbformat==5.11.1",
    "ipykernel==7.4.0",
    "fastapi==0.162.4",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[project.scripts]
hotel-cancellation = "hotel_cancellation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks/_build", "service/core/features.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"notebooks/_src/*.py" = ["E402", "F401", "F811", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the pipeline end to end (minutes)",
    "needs_artifacts: needs a completed pipeline run (make pipeline)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
